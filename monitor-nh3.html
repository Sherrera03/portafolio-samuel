<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Amoníaco NH₃</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        :root {
            --panel:      #0f1922;
            --panel-2:    #16232f;
            --linea:      rgba(255,255,255,0.08);
            --texto:      #eef4f8;
            --texto-2:    #8ea4b3;
            --acento:     #17c964;   
            --fondo-a:    #0a1016;    
            --fondo-b:    #0e1720;
            --glow:       rgba(23,201,100,0.35);
        }

        body[data-nivel="normal"] { --acento: #17c964; --glow: rgba(23,201,100,0.35); --fondo-a: #08130d; --fondo-b: #0c1a13; }
        body[data-nivel="precaucion"] { --acento: #f5c518; --glow: rgba(245,197,24,0.45); --fondo-a: #3a3006; --fondo-b: #4a3d00; }
        body[data-nivel="advertencia"] { --acento: #ff8a1f; --glow: rgba(255,138,31,0.5); --fondo-a: #4a2405; --fondo-b: #5e2c02; }
        body[data-nivel="critico"] { --acento: #ff3b47; --glow: rgba(255,59,71,0.6); --fondo-a: #4a0006; --fondo-b: #64020c; }
        body[data-nivel="desconectado"] { --acento: #7a8a97; --glow: rgba(122,138,151,0.25); --fondo-a: #0a1016; --fondo-b: #131c24; }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--texto); margin: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
            background: radial-gradient(1200px 600px at 50% -10%, var(--fondo-b), transparent 70%), linear-gradient(160deg, var(--fondo-a), #05090d 90%);
            transition: background 0.6s ease;
        }

        body[data-nivel="critico"] { animation: latidoFondo 1.1s ease-in-out infinite; }
        @keyframes latidoFondo {
            0%,100% { background: radial-gradient(1200px 600px at 50% -10%, #64020c, transparent 70%), linear-gradient(160deg, #4a0006, #05090d 90%); }
            50% { background: radial-gradient(1200px 600px at 50% -10%, #8f0311, transparent 70%), linear-gradient(160deg, #6b0009, #05090d 90%); }
        }

        .hmi {
            width: 100%; max-width: 650px;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--linea); border-radius: 16px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset, 0 0 40px -8px var(--glow);
            transition: box-shadow 0.5s ease;
        }

        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: rgba(0,0,0,0.25); border-bottom: 1px solid var(--linea); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--texto-2); }
        .marca { font-weight: 700; color: var(--texto); }
        .marca span { color: var(--acento); }
        .topbar-right { display: flex; align-items: center; gap: 14px; }
        .reloj { font-variant-numeric: tabular-nums; }

        .led { display: inline-flex; align-items: center; gap: 6px; font-size: 0.68rem; }
        .led .punto { width: 9px; height: 9px; border-radius: 50%; background: #46e07a; box-shadow: 0 0 8px #46e07a; }
        .led.off .punto { background: #ff4d5a; box-shadow: 0 0 8px #ff4d5a; }
        .led.na .punto { background: #6c7a86; box-shadow: none; }

        .zona { padding: 20px 26px 8px; }
        .zona h1 { margin: 0; font-size: 2rem; letter-spacing: 0.02em; }
        .zona .sensor { color: var(--texto-2); font-size: 0.95rem; margin-top: 5px; }

        .estado { margin: 18px 26px 0; padding: 12px; text-align: center; border-radius: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; font-size: 1.15rem; color: #0b0f12; background: var(--acento); box-shadow: 0 0 22px -6px var(--glow); transition: background 0.4s ease; }
        body[data-nivel="critico"] .estado, body[data-nivel="advertencia"] .estado { color: #fff; }
        body[data-nivel="desconectado"] .estado { color: var(--texto); background: #2a3742; }

        .lectura { text-align: center; padding: 45px 22px 25px; }
        .valor { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: clamp(6rem, 28vw, 12rem); font-weight: 700; line-height: 0.9; color: var(--acento); font-variant-numeric: tabular-nums; text-shadow: 0 0 30px var(--glow); transition: color 0.4s ease; }
        .unidad { font-size: 1.2rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--texto-2); margin-top: 15px; }

        .escala { padding: 18px 22px 6px; }
        .barra { position: relative; height: 16px; border-radius: 8px; background: linear-gradient(to right, #17c964 0%, #17c964 16.666%, #f5c518 16.666%,#f5c518 33.333%, #ff8a1f 33.333%,#ff8a1f 66.666%, #ff3b47 66.666%,#ff3b47 100%); box-shadow: inset 0 2px 6px rgba(0,0,0,0.45); overflow: visible; }
        .aguja { position: absolute; top: -5px; bottom: -5px; width: 3px; left: 0%; background: #ffffff; border-radius: 2px; box-shadow: 0 0 8px rgba(255,255,255,0.9), 0 0 2px #000; transition: left 0.5s cubic-bezier(.22,.61,.36,1); }
        .aguja::after { content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #fff; }
        .marcas { position: relative; height: 18px; margin-top: 4px; font-size: 0.66rem; color: var(--texto-2); font-variant-numeric: tabular-nums; }
        .marca-t { position: absolute; transform: translateX(-50%); }
        .marca-t small { display: block; opacity: 0.6; font-size: 0.9em; }

        .pie { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 22px 20px; border-top: 1px solid var(--linea); margin-top: 10px; font-size: 0.78rem; color: var(--texto-2); }
        .pie .hora b { color: var(--texto); font-variant-numeric: tabular-nums; }
        .controles { display: flex; gap: 8px; }
        .btn { border: 1px solid var(--linea); background: rgba(255,255,255,0.04); color: var(--texto); padding: 8px 12px; border-radius: 8px; font-size: 0.74rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn-sonido.armado { background: #17c964; color: #06120a; border-color: transparent; }
        .btn-demo.activo { background: #4f7cff; color: #fff; border-color: transparent; }

        /* --- Ventana Modal de Historial --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.activo { display: flex; }
        .modal {
            background: var(--panel-2); padding: 25px; border-radius: 16px; border: 1px solid var(--linea);
            max-width: 450px; width: 90%; max-height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--linea); padding-bottom: 15px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; font-size: 1.2rem; color: #fff; }
        .btn-cerrar { background: none; border: none; color: var(--texto-2); font-size: 1.5rem; cursor: pointer; }
        .btn-cerrar:hover { color: #fff; }
        
        .lista-historial { flex: 1; overflow-y: auto; padding-right: 5px; list-style: none; margin: 0; padding-left: 0; }
        .item-historial { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--linea); font-size: 0.9rem; }
        .item-historial .fecha { color: var(--texto-2); }
        .item-historial .nivel { font-weight: bold; color: #ff3b47; background: rgba(255,59,71,0.1); padding: 2px 8px; border-radius: 4px;}
        .sin-datos { text-align: center; color: var(--texto-2); padding: 30px 0; font-style: italic; }

        @media (max-width: 420px) { .topbar { font-size: 0.62rem; gap: 8px; } .pie { justify-content: center; } }
    </style>
</head>
<body data-nivel="desconectado">
    
    <div class="hmi">
        <!-- Barra superior -->
        <div class="topbar">
            <div class="marca"><a href="index.html" style="color:var(--texto-2);text-decoration:none;margin-right:10px">&larr; Portafolio</a>MONITOR <span>NH₃</span></div>
            <div class="topbar-right">
                <div class="reloj" id="reloj">--:--:--</div>
                <div class="led na" id="ledRs485"><span class="punto"></span> RS485</div>
            </div>
        </div>

        <!-- Identificación -->
        <div class="zona">
            <h1>Zona 1</h1>
            <div class="sensor">Sensor de amoníaco NKYF-KF8 · Canal 8</div>
        </div>

        <!-- Banner de estado -->
        <div class="estado" id="estado">Buscando conexión…</div>

        <!-- Lectura principal -->
        <div class="lectura">
            <div class="valor" id="valor">--</div>
            <div class="unidad">ppm · NH₃</div>
        </div>

        <!-- Escala de riesgo -->
        <div class="escala">
            <div class="barra">
                <div class="aguja" id="aguja"></div>
            </div>
            <div class="marcas">
                <div class="marca-t" style="left:0%">0</div>
                <div class="marca-t" style="left:16.66%">25<small>PREC.</small></div>
                <div class="marca-t" style="left:33.33%">50<small>ADV.</small></div>
                <div class="marca-t" style="left:66.66%">100<small>CRÍT.</small></div>
                <div class="marca-t" style="left:100%">150</div>
            </div>
        </div>

        <!-- Pie -->
        <div class="pie">
            <div class="hora">🕒 Última lectura: <b id="hora">--:--:--</b></div>
            <div class="controles">
                <button id="btnHistorial" class="btn">📜 Historial</button>
                <button id="btnDemo" class="btn btn-demo">Modo demo</button>
                <button id="btnSonido" class="btn btn-sonido">🔇 Armar sirena</button>
            </div>
        </div>
    </div>

    <!-- VENTANA MODAL DE HISTORIAL -->
    <div class="modal-overlay" id="modalHistorial">
        <div class="modal">
            <div class="modal-header">
                <h2>Eventos de Alarma (NH₃ > 25)</h2>
                <button id="btnCerrar" class="btn-cerrar">×</button>
            </div>
            <ul class="lista-historial" id="listaHistorial">
                <div class="sin-datos">Cargando datos...</div>
            </ul>
        </div>
    </div>

    <script>
        const RASPBERRY_URL      = 'http://192.168.0.30:5000/api/amoniaco';
        const INTERVALO_MS       = 2000;
        const UMBRAL_PRECAUCION  = 25;
        const UMBRAL_ADVERTENCIA = 50;
        const UMBRAL_CRITICO     = 100;
        const ESCALA_MAX         = 150;

        let sonidoActivado = false, sintetizador = null, pitidoIntervalo = null, patronActual = null, ultimoNivel = 'desconectado';
        let historialGlobal = []; // Guarda los datos del historial aquí

        async function armarAlarma() {
            const btn = document.getElementById('btnSonido');
            if (typeof Tone === 'undefined') { btn.textContent = '🔇 Sin audio (offline)'; return; }
            if (!sonidoActivado) {
                await Tone.start();
                sintetizador = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'square' }, envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 0.4 } }).toDestination();
                sonidoActivado = true;
                btn.classList.add('armado');
                btn.textContent = '🔊 Sirena armada';
                patronActual = null;
                gestionarSonido(ultimoNivel);
            }
        }

        function beep(nota, dur) { if (sonidoActivado && sintetizador) sintetizador.triggerAttackRelease(nota, dur); }

        function gestionarSonido(nivel) {
            let deseado = null;
            if (nivel === 'critico') deseado = 'rapido'; else if (nivel === 'advertencia') deseado = 'lento';
            if (deseado === patronActual) return;
            clearInterval(pitidoIntervalo); pitidoIntervalo = null; patronActual = deseado;
            if (!deseado || !sonidoActivado) return;
            if (deseado === 'lento') { pitidoIntervalo = setInterval(() => beep('C5', '0.15s'), 1500); } 
            else { pitidoIntervalo = setInterval(() => { beep('C6', '0.1s'); setTimeout(() => beep('C6', '0.1s'), 180); }, 700); }
        }

        function clasificar(ppm) {
            if (ppm >= UMBRAL_CRITICO) return 'critico';
            if (ppm >= UMBRAL_ADVERTENCIA) return 'advertencia';
            if (ppm >= UMBRAL_PRECAUCION) return 'precaucion';
            return 'normal';
        }

        const ETIQUETAS = { normal: 'Normal', precaucion: 'Precaución', advertencia: 'Advertencia', critico: 'Crítico — Evacuar', desconectado: 'Sin conexión' };

        function actualizarHistorialUI() {
            const contenedor = document.getElementById('listaHistorial');
            if (historialGlobal.length === 0) {
                contenedor.innerHTML = '<div class="sin-datos">No hay eventos de alarma registrados.</div>';
                return;
            }
            
            contenedor.innerHTML = '';
            historialGlobal.forEach(evento => {
                const li = document.createElement('li');
                li.className = 'item-historial';
                li.innerHTML = `<span class="fecha">🕒 ${evento.fecha_hora}</span> <span class="nivel">${evento.ppm} ppm</span>`;
                contenedor.appendChild(li);
            });
        }

        function abrirHistorial() {
            document.getElementById('modalHistorial').classList.add('activo');
            actualizarHistorialUI();
        }

        function cerrarHistorial() {
            document.getElementById('modalHistorial').classList.remove('activo');
        }

        function render({ ppm, rs485, hora, error, historialRecibido }) {
            const led = document.getElementById('ledRs485');
            if (historialRecibido) historialGlobal = historialRecibido;

            if (error) {
                document.body.dataset.nivel = 'desconectado'; ultimoNivel = 'desconectado';
                document.getElementById('estado').textContent = ETIQUETAS.desconectado;
                document.getElementById('valor').textContent = '--';
                document.getElementById('aguja').style.left = '0%';
                led.className = 'led na'; gestionarSonido('desconectado'); return;
            }

            const nivel = clasificar(ppm);
            ultimoNivel = nivel;
            document.body.dataset.nivel = nivel;

            document.getElementById('estado').textContent = ETIQUETAS[nivel];
            document.getElementById('valor').textContent  = ppm;
            document.getElementById('hora').textContent   = hora || '--:--:--';

            const pct = Math.max(0, Math.min(100, (ppm / ESCALA_MAX) * 100));
            document.getElementById('aguja').style.left = pct + '%';
            led.className = rs485 ? 'led' : 'led off';
            gestionarSonido(nivel);
        }

        async function leerSensor() {
            try {
                const r = await fetch(RASPBERRY_URL);
                const d = await r.json();
                render({ ppm: Number(d.ppm), rs485: !!d.conexion_rs485, hora: d.ultima_actualizacion, historialRecibido: d.historial });
            } catch (e) {
                render({ error: true });
            }
        }

        /* --- Modo Demo --- */
        let modoDemo = false, demoPpm = 0, bucle = null;
        function tickDemo() {
            demoPpm += 6; if (demoPpm > 135) demoPpm = 0;
            const ahora = new Date().toLocaleTimeString('es-SV', { hour12: false });
            
            // Simular guardado de historial en modo demo (solo visual en la app, no se guarda en Python)
            if (demoPpm === 30) historialGlobal.unshift({fecha_hora: ahora, ppm: 30});
            if (document.getElementById('modalHistorial').classList.contains('activo')) actualizarHistorialUI();

            render({ ppm: demoPpm, rs485: true, hora: ahora, historialRecibido: historialGlobal });
        }

        function iniciarBucle() {
            clearInterval(bucle);
            if (modoDemo) { bucle = setInterval(tickDemo, 600); tickDemo(); } 
            else { bucle = setInterval(leerSensor, INTERVALO_MS); leerSensor(); }
        }

        function alternarDemo() {
            modoDemo = !modoDemo; demoPpm = 0;
            document.getElementById('btnDemo').classList.toggle('activo', modoDemo);
            document.getElementById('btnDemo').textContent = modoDemo ? 'Demo activo' : 'Modo demo';
            iniciarBucle();
        }

        setInterval(() => { document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-SV', { hour12: false }); }, 1000);
        document.getElementById('btnHistorial').addEventListener('click', abrirHistorial);
        document.getElementById('btnDemo').addEventListener('click', alternarDemo);
        document.getElementById('btnSonido').addEventListener('click', armarAlarma);
        document.getElementById('btnCerrar').addEventListener('click', cerrarHistorial);
        alternarDemo(); // portafolio: arranca en demo, la API de la Raspberry Pi solo existe en la red de planta
    </script>
</body>
</html>
